name: Verify local product
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest evaluation.test_evaluation -v
      - run: python -m evaluation.run verify
      - run: python -m compileall -q prompt_skill_linter tests scripts
      - run: python scripts/reproduce.py
      - run: |
          while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done < <(find web -name '*.js' -print0)
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - run: python -m pip install --no-deps --target /tmp/linter-installed dist/*.whl
      - run: cd /tmp && PYTHONPATH=/tmp/linter-installed python -c "from prompt_skill_linter.service import examples,analyze; from prompt_skill_linter.server import WEB_ROOT; assert (WEB_ROOT/'index.html').exists(); assert analyze(examples()['examples'][0]['bundle'])['summary']['error']==2"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python web/tests/test_ui.py
      - run: python scripts/review_browser_e2e.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence
          path: |
            web/qa-artifacts/
            artifacts/browser-review/
          if-no-files-found: warn
